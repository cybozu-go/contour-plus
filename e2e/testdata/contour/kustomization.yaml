apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/00-common.yaml
  - upstream/01-contour-config.yaml
  - upstream/02-job-certgen.yaml
  - upstream/02-rbac.yaml
  - upstream/02-role-contour.yaml
  - upstream/02-service-contour.yaml
  - upstream/03-contour.yaml
  - upstream/03-envoy.yaml
  - ./service-envoy.yaml
images:
  - name: ghcr.io/projectcontour/contour
    newName: ghcr.io/cybozu/contour
    newTag: 1.33.5.1
    digest: sha256:ab15421380bf018838a6f4586ff27897cf915bda7f38b004935ebc20b2277797
  - name: docker.io/envoyproxy/envoy
    newName: ghcr.io/cybozu/envoy
    newTag: 1.35.13.1
    digest: sha256:53fac0f1471fe09c9ee18119078ea0e9e74f3aa019cb1f566f2694b0e2c0e749
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: contour
      namespace: projectcontour
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--ingress-class-name=test"
