apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/00-common.yaml
  - upstream/01-contour-config.yaml
  - upstream/02-job-certgen.yaml
  - upstream/02-rbac.yaml
  - upstream/02-role-contour.yaml
  - upstream/02-service-contour.yaml
  - upstream/03-contour.yaml
  - upstream/03-envoy.yaml
  - ./service-envoy.yaml
images:
  - name: ghcr.io/projectcontour/contour
    newName: ghcr.io/cybozu/contour
    newTag: 1.33.7.2
    digest: sha256:5da16a2b04e49f6655f767bb6f8cb8b18f8399254907ef0a8484301a868acae7
  - name: docker.io/envoyproxy/envoy
    newName: ghcr.io/cybozu/envoy
    newTag: 1.38.4.3
    digest: sha256:e092be24267f331c518c27d740b749fe672dcbd16bcd3e08e2ae763df948478f
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: contour
      namespace: projectcontour
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--ingress-class-name=test"
