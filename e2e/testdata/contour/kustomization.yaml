apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/00-common.yaml
  - upstream/01-contour-config.yaml
  - upstream/02-job-certgen.yaml
  - upstream/02-rbac.yaml
  - upstream/02-role-contour.yaml
  - upstream/02-service-contour.yaml
  - upstream/03-contour.yaml
  - upstream/03-envoy.yaml
  - ./service-envoy.yaml
images:
  - name: ghcr.io/projectcontour/contour
    newName: ghcr.io/cybozu/contour
    newTag: 1.33.7.2
    digest: sha256:6a273f6780c7df03f8813dcc12157887fb72e14400530bcd44141e277a3dee77
  - name: docker.io/envoyproxy/envoy
    newName: ghcr.io/cybozu/envoy
    newTag: 1.38.8.1
    digest: sha256:6237c14e021b5a197e97fe141b67937ba74a74bbe2e7d62f3e20853e75130f4b
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: contour
      namespace: projectcontour
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--ingress-class-name=test"
