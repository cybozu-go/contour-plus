name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  image:
    name: Push container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - uses: ./.github/actions/aqua
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: make setup
      - run: make check-generate
      - run: make lint
      - run: make test
      - run: make docker-build
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push versioned image to ghcr.io
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          docker tag ghcr.io/cybozu-go/contour-plus:latest ghcr.io/cybozu-go/contour-plus:$TAG
          docker push ghcr.io/cybozu-go/contour-plus:$TAG
      - name: Push latest image to ghcr.io
        if: ${{ !contains(github.ref, '-') }}
        run: docker push ghcr.io/cybozu-go/contour-plus:latest
  release:
    name: Release on GitHub
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --notes "See [CHANGELOG.md](./CHANGELOG.md) for details." \
            $([[ "${TAG}" == *-* ]] && echo --prerelease)
